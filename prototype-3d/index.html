<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHRONOS 3D Prototype v0.0.1</title><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#263750,#090d18 70%);color:#eee;font:16px system-ui,sans-serif;min-height:100dvh}main{max-width:850px;margin:auto;padding: max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}header{text-align:center;color:#e8c57d}h1{letter-spacing:.12em;margin:8px 0;font-size:28px}small{color:#aab5c9}model-viewer{width:100%;height:58dvh;min-height:240px;--poster-color:transparent;touch-action:pan-y}section{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button,select{background:#18243b;color:#f5dfb0;border:1px solid #a8874e;border-radius:8px;padding:12px;font:inherit}button:disabled,select:disabled{opacity:.45}p{text-align:center;color:#b8c4d8;font-size:14px}#status{min-height:22px}button:focus-visible,select:focus-visible{outline:2px solid #fff}</style></head><body><main><header><h1>CHRONOS</h1><div>時序之戰 · 3D 技術展示</div><small>PROTOTYPE v0.0.1</small></header><model-viewer id="model" src="https://threejs.org/examples/models/gltf/Soldier.glb" alt="真人比例士兵立體測試模型" camera-controls touch-action="none" auto-rotate rotation-per-second="20deg" shadow-intensity="1" exposure="1" camera-orbit="0deg 75deg auto" interaction-prompt="none"></model-viewer><p id="status" role="status">正在載入 3D 引擎及模型…</p><section><button id="rotate" disabled>停止自動旋轉</button><button id="play" disabled>暫停動畫</button><select id="animations" aria-label="選擇人物動畫" disabled></select><button id="reset" disabled>重置視角</button><button id="full">全螢幕</button></section><p>單指拖曳旋轉 · 雙指縮放 · 電腦滑鼠拖曳及滾輪</p><p>測試素材：Three.js Soldier.glb；非 CHRONOS 正式角色。需網路載入，不使用正式遊戲快取。</p></main><script>const m=document.getElementById('model'),s=document.getElementById('status'),a=document.getElementById('animations'),r=document.getElementById('rotate'),p=document.getElementById('play'),z=document.getElementById('reset');let loaded=false;const timeout=setTimeout(()=>{if(!loaded)s.textContent='載入逾時，請確認網路或重新整理。'},25000);m.addEventListener('load',()=>{loaded=true;clearTimeout(timeout);s.textContent='模型已載入，可自由旋轉及縮放';a.replaceChildren();for(const n of m.availableAnimations){const o=document.createElement('option');o.value=n;o.textContent=({Idle:'站立 Idle',Walk:'走路 Walk',Run:'跑步 Run'})[n]||n;a.append(o)}r.disabled=z.disabled=false;if(a.options.length){a.value=m.availableAnimations.find(n=>n.toLowerCase()==='idle')||m.availableAnimations[0];m.animationName=a.value;m.play();a.disabled=p.disabled=false}else{s.textContent+='；此模型無動畫'}});m.addEventListener('error',()=>{clearTimeout(timeout);s.textContent='模型載入失敗，請確認網路後重新整理。'});r.onclick=()=>{m.autoRotate=!m.autoRotate;r.textContent=m.autoRotate?'停止自動旋轉':'開始自動旋轉'};p.onclick=()=>{if(m.paused){m.play();p.textContent='暫停動畫'}else{m.pause();p.textContent='播放動畫'}};a.onchange=()=>{m.animationName=a.value;m.play();p.textContent='暫停動畫'};z.onclick=()=>{m.cameraOrbit='0deg 75deg auto';m.cameraTarget='auto auto auto';m.fieldOfView='auto';m.jumpCameraToGoal()};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else s.textContent='此瀏覽器不支援網頁全螢幕，仍可直接操作模型。'}catch(e){s.textContent='此裝置無法切換全螢幕。'}};</script></body></html>
